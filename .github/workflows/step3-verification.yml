name: step3-verification

on:
  workflow_dispatch:
  push:
    branches: [main, "fix/step3-tidal-sonic-metadata"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm install
      - run: npm run build
      - run: |
          for i in 1 2 3 4 5; do
            echo "TIDAL deep-ingestion verification cycle $i/5"
            npm test -- tests/tidal-deep-ingestion.test.ts
          done
      - run: |
          for i in 1 2 3 4 5; do
            echo "DSP process verification cycle $i/5"
            npm test -- tests/process-audit-job.test.ts
          done
      - run: |
          for i in 1 2 3 4 5; do
            echo "MetadataEngine verification cycle $i/5"
            npm test -- tests/metadata-engine.test.ts
          done
      - run: |
          for i in 1 2 3 4 5; do
            echo "Full-suite verification cycle $i/5"
            npm test
          done
      - run: |
          for i in 1 2 3 4 5; do
            echo "TypeScript build verification cycle $i/5"
            npm run build
          done
