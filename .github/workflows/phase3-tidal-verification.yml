name: phase3-tidal-verification

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-tidal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm install
      - run: |
          for i in 1 2 3 4 5; do
            echo "TIDAL deep-ingestion focused verification cycle $i/5"
            npm test -- tests/tidal-deep-ingestion.test.ts
          done
      - run: |
          for i in 1 2 3 4 5; do
            echo "Full-suite verification cycle $i/5"
            npm test
          done
      - run: |
          for i in 1 2 3 4 5; do
            echo "TypeScript build verification cycle $i/5"
            npm run build
          done
